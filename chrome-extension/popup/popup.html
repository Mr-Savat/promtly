<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Promptly</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 300px; padding: 16px; background: #ffffff; color: #1f2533; font-size: 13px; }
    .header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .logo { width: 24px; height: 24px; border-radius: 6px; background: #1f4ae6; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; }
    .title { font-weight: 600; font-size: 14px; }
    .status-badge { margin-left: auto; font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 12px; background: #ecfdf5; color: #059669; }
    .card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
    .shortcut-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #64748b; margin-top: 6px; }
    kbd { background: #e2e8f0; border-radius: 4px; padding: 2px 6px; font-family: monospace; font-size: 11px; color: #334155; }
    .btn { display: block; width: 100%; text-align: center; text-decoration: none; padding: 8px 12px; border-radius: 8px; font-weight: 600; font-size: 12px; background: #1f4ae6; color: #fff; cursor: pointer; border: none; transition: background 0.15s; }
    .btn:hover { background: #173dbd; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">✦</div>
    <div class="title">Promptly</div>
    <span class="status-badge">Active</span>
  </div>
  <div class="card">
    <p style="font-weight: 500; margin-bottom: 4px;">Assistant is running</p>
    <p style="color: #64748b; font-size: 11px;">Active on ChatGPT, Claude, and Gemini.</p>
    <div class="shortcut-row">
      <span>Quick trigger:</span>
      <kbd>Cmd/Ctrl+Shift+P</kbd>
    </div>
  </div>
  <a href="http://localhost:5173/app" target="_blank" class="btn">Open Web Studio</a>
</body>
</html>
