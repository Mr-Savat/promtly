<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Promptly — Don't learn prompt engineering. Just tell AI what you want.</title>
    <meta
      name="description"
      content="Promptly finds what's missing from your request, asks the right questions, and helps you create a prompt AI can actually understand."
    />
    <meta property="og:title" content="Promptly — Your AI Prompt Assistant" />
    <meta
      property="og:description"
      content="Don't learn prompt engineering. Just tell AI what you want."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Patch React DOM reconciliation against Google Translate <font> mutations -->
    <script>
      (function () {
        if (typeof Node === 'function' && Node.prototype) {
          var originalRemoveChild = Node.prototype.removeChild;
          Node.prototype.removeChild = function (child) {
            if (child.parentNode !== this) {
              return child;
            }
            return originalRemoveChild.apply(this, arguments);
          };

          var originalInsertBefore = Node.prototype.insertBefore;
          Node.prototype.insertBefore = function (newNode, referenceNode) {
            if (referenceNode && referenceNode.parentNode !== this) {
              return newNode;
            }
            return originalInsertBefore.apply(this, arguments);
          };
        }
      })();
    </script>
  </head>
  <body>
    <!-- Hidden Google Translate Element Container (rendered offscreen to allow DOM events) -->
    <div id="google_translate_element" style="position: absolute; left: -9999px; top: -9999px; width: 0; height: 0; opacity: 0; pointer-events: none;" aria-hidden="true"></div>

    <div id="root"></div>

    <!-- Google Translate API Script (deferred so React mounts first) -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement(
            {
              pageLanguage: 'en',
              includedLanguages: 'en,km',
              autoDisplay: false,
            },
            'google_translate_element'
          );
        }
      }
    </script>
    <script
      type="text/javascript"
      defer
      src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
    ></script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
